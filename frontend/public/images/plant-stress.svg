<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFpga" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1a2e"/>
      <stop offset="100%" stop-color="#040c17"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142845"/>
      <stop offset="100%" stop-color="#0d1b30"/>
    </linearGradient>
  </defs>
  
  <rect width="600" height="360" rx="12" fill="url(#bgFpga)"/>
  
  <!-- Circuit Grid Pattern -->
  <g stroke="rgba(0, 242, 254, 0.07)" stroke-width="1">
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="120" y1="0" x2="120" y2="360"/>
    <line x1="240" y1="0" x2="240" y2="360"/>
    <line x1="360" y1="0" x2="360" y2="360"/>
    <line x1="480" y1="0" x2="480" y2="360"/>
  </g>
  
  <!-- Left Side: Sensor Input & Leaf Indicator -->
  <rect x="40" y="90" width="120" height="180" rx="10" fill="#0f223a" stroke="#10b981" stroke-width="1.5"/>
  <text x="100" y="120" fill="#10b981" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Plant Sensory</text>
  
  <!-- Leaf icon graphic -->
  <path d="M 100 140 C 75 140 70 170 100 195 C 130 170 125 140 100 140 Z" fill="none" stroke="#10b981" stroke-width="2"/>
  <path d="M 100 150 L 100 190" stroke="#10b981" stroke-width="1.5"/>
  
  <rect x="52" y="215" width="96" height="24" rx="4" fill="#0c2d27"/>
  <text x="100" y="231" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Multispectral</text>
  
  <!-- Pipelined RTL Bus arrow -->
  <path d="M 160 180 H 220" stroke="#00f2fe" stroke-width="2" stroke-dasharray="4 2"/>
  <polygon points="225,180 217,175 217,185" fill="#00f2fe"/>
  
  <!-- Center: FPGA Zynq-7000 RTL Pipeline Unit -->
  <rect x="225" y="65" width="230" height="230" rx="14" fill="url(#chipGrad)" stroke="#00f2fe" stroke-width="2"/>
  
  <!-- Chip Pins -->
  <g fill="#38bdf8">
    <rect x="250" y="55" width="6" height="10" rx="1"/>
    <rect x="280" y="55" width="6" height="10" rx="1"/>
    <rect x="310" y="55" width="6" height="10" rx="1"/>
    <rect x="340" y="55" width="6" height="10" rx="1"/>
    <rect x="370" y="55" width="6" height="10" rx="1"/>
    <rect x="400" y="55" width="6" height="10" rx="1"/>
    
    <rect x="250" y="295" width="6" height="10" rx="1"/>
    <rect x="280" y="295" width="6" height="10" rx="1"/>
    <rect x="310" y="295" width="6" height="10" rx="1"/>
    <rect x="340" y="295" width="6" height="10" rx="1"/>
    <rect x="370" y="295" width="6" height="10" rx="1"/>
    <rect x="400" y="295" width="6" height="10" rx="1"/>
  </g>
  
  <text x="340" y="100" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle">AMD/Xilinx Zynq-7000</text>
  <text x="340" y="118" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Verilog RTL Engine</text>
  
  <!-- RTL Architecture Boxes -->
  <rect x="245" y="135" width="85" height="40" rx="4" fill="#08182b" stroke="#38bdf8" stroke-width="1"/>
  <text x="287" y="152" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle" font-weight="600">Fixed-Point</text>
  <text x="287" y="166" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">Q8.8 MAC</text>
  
  <rect x="350" y="135" width="85" height="40" rx="4" fill="#08182b" stroke="#38bdf8" stroke-width="1"/>
  <text x="392" y="152" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle" font-weight="600">Activation</text>
  <text x="392" y="166" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">LUT Pipeline</text>
  
  <rect x="245" y="190" width="190" height="45" rx="6" fill="#08182b" stroke="#00f2fe" stroke-width="1.2"/>
  <text x="340" y="210" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle" font-weight="600">Systolic Array Accelerator</text>
  <text x="340" y="225" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">Hardware Clock: Vivado Optimized</text>
  
  <rect x="245" y="248" width="190" height="28" rx="4" fill="#15263d"/>
  <text x="340" y="266" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle" font-weight="600">Status: In Progress</text>
  
  <!-- Right Output Badge -->
  <path d="M 455 180 H 495" stroke="#00f2fe" stroke-width="2"/>
  <polygon points="500,180 492,175 492,185" fill="#00f2fe"/>
  
  <rect x="500" y="135" width="80" height="90" rx="8" fill="#13233a" stroke="#00f2fe" stroke-width="1.5"/>
  <text x="540" y="165" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Stress</text>
  <text x="540" y="180" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Score</text>
  <text x="540" y="208" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" text-anchor="middle">Edge-AI</text>
  
  <!-- Title / Tags -->
  <text x="40" y="42" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">Verilog RTL FPGA Acceleration</text>
  <text x="40" y="335" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">Vivado Design Suite · Custom RTL · Low Latency Fixed-Point</text>
</svg>
