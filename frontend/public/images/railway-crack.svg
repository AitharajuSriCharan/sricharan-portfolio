<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgRail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1526"/>
      <stop offset="100%" stop-color="#050b14"/>
    </linearGradient>
  </defs>
  
  <rect width="600" height="360" rx="12" fill="url(#bgRail)"/>
  
  <!-- Subtle Grid -->
  <g stroke="rgba(56, 189, 248, 0.08)" stroke-width="1">
    <line x1="0" y1="90" x2="600" y2="90"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="270" x2="600" y2="270"/>
    <line x1="150" y1="0" x2="150" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="450" y1="0" x2="450" y2="360"/>
  </g>
  
  <!-- Railway Track Model -->
  <!-- Sleepers / Ties -->
  <g fill="#1e293b" stroke="#334155" stroke-width="1.5">
    <rect x="60" y="190" width="16" height="110" rx="2"/>
    <rect x="110" y="190" width="16" height="110" rx="2"/>
    <rect x="160" y="190" width="16" height="110" rx="2"/>
    <rect x="210" y="190" width="16" height="110" rx="2"/>
    <rect x="260" y="190" width="16" height="110" rx="2"/>
    <rect x="310" y="190" width="16" height="110" rx="2"/>
    <rect x="360" y="190" width="16" height="110" rx="2"/>
    <rect x="410" y="190" width="16" height="110" rx="2"/>
    <rect x="460" y="190" width="16" height="110" rx="2"/>
    <rect x="510" y="190" width="16" height="110" rx="2"/>
  </g>
  
  <!-- Steel Rails -->
  <rect x="40" y="210" width="520" height="12" rx="2" fill="#475569" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="40" y="265" width="520" height="12" rx="2" fill="#475569" stroke="#94a3b8" stroke-width="1.5"/>
  
  <!-- Track Crack on Top Rail -->
  <path d="M 315 210 L 319 216 L 316 222" stroke="#ef4444" stroke-width="2.5" fill="none"/>
  
  <!-- IR Sensor Detection Drone / Cart Prototype -->
  <rect x="260" y="100" width="115" height="65" rx="8" fill="#0f2139" stroke="#00f2fe" stroke-width="2"/>
  <circle cx="280" cy="165" r="7" fill="#334155" stroke="#00f2fe" stroke-width="1.5"/>
  <circle cx="355" cy="165" r="7" fill="#334155" stroke="#00f2fe" stroke-width="1.5"/>
  
  <!-- IR Transceiver Pair -->
  <rect x="305" y="150" width="12" height="14" rx="2" fill="#ef4444"/>
  <rect x="323" y="150" width="12" height="14" rx="2" fill="#00f2fe"/>
  
  <!-- IR Beam to Crack -->
  <line x1="311" y1="165" x2="318" y2="210" stroke="#ef4444" stroke-width="2" stroke-dasharray="3 2"/>
  <line x1="329" y1="165" x2="318" y2="210" stroke="#00f2fe" stroke-width="2" stroke-dasharray="3 2"/>
  
  <!-- Alert Signal Ping -->
  <circle cx="318" cy="210" r="14" fill="none" stroke="#ef4444" stroke-width="1.5" opacity="0.8"/>
  <circle cx="318" cy="210" r="24" fill="none" stroke="#ef4444" stroke-width="1" opacity="0.4"/>
  
  <!-- Detection Box UI -->
  <rect x="400" y="55" width="165" height="60" rx="8" fill="#13233c" stroke="#ef4444" stroke-width="1.5"/>
  <circle cx="420" cy="85" r="6" fill="#ef4444"/>
  <text x="435" y="80" fill="#f87171" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">ANOMALY DETECTED</text>
  <text x="435" y="98" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">IR Reflection Delta > Th</text>
  
  <!-- Platform Badge -->
  <rect x="40" y="35" width="160" height="30" rx="6" fill="#112240" stroke="#38bdf8" stroke-width="1"/>
  <text x="50" y="55" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Tinkercad Simulated</text>
  
  <!-- Footer Info -->
  <text x="40" y="335" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">Embedded C/C++ · Dual IR Sensing · Real-Time Alert Trigger</text>
</svg>
