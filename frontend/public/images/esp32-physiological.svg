<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgEsp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081528"/>
      <stop offset="100%" stop-color="#040c18"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="pulseGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" rx="12" fill="url(#bgEsp)"/>

  <!-- Circuit Grid Backdrop -->
  <g stroke="rgba(0, 242, 254, 0.07)" stroke-width="1">
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="120" y1="0" x2="120" y2="360"/>
    <line x1="240" y1="0" x2="240" y2="360"/>
    <line x1="360" y1="0" x2="360" y2="360"/>
    <line x1="480" y1="0" x2="480" y2="360"/>
  </g>

  <!-- Left: Sensor Interfacing Module -->
  <rect x="40" y="80" width="130" height="190" rx="10" fill="#0c1d34" stroke="#00f2fe" stroke-width="1.5"/>
  <rect x="55" y="95" width="100" height="26" rx="4" fill="#082342"/>
  <text x="105" y="112" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">SENSOR NODE</text>

  <!-- Sensor Optical/Signal Graphic -->
  <circle cx="105" cy="155" r="26" fill="#132a48" stroke="#f43f5e" stroke-width="2"/>
  <!-- Heartbeat / PPG waveform inside sensor icon -->
  <path d="M 90 155 L 97 155 L 101 144 L 106 166 L 110 150 L 114 157 L 120 155" fill="none" stroke="#f43f5e" stroke-width="2" stroke-linecap="round"/>

  <rect x="55" y="195" width="100" height="22" rx="4" fill="#112540"/>
  <text x="105" y="210" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-anchor="middle">Physiological Data</text>

  <rect x="55" y="225" width="100" height="26" rx="4" fill="#0a1a30" stroke="#38bdf8" stroke-width="1"/>
  <text x="105" y="242" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">ADC Telemetry</text>

  <!-- Connecting Bus from Sensor to ESP32 -->
  <path d="M 170 175 H 220" stroke="#00f2fe" stroke-width="2" stroke-dasharray="4 2"/>
  <polygon points="225,175 217,170 217,180" fill="#00f2fe"/>

  <!-- Center: ESP32 Processing Unit -->
  <rect x="225" y="65" width="170" height="220" rx="12" fill="#0e223d" stroke="#38bdf8" stroke-width="2"/>

  <!-- ESP32 PCB Antenna Trace -->
  <path d="M 245 75 H 375 M 255 83 H 365 M 265 91 H 355" stroke="#f59e0b" stroke-width="2" fill="none"/>
  <text x="310" y="115" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" text-anchor="middle">ESP32 MCU</text>
  <text x="310" y="130" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Xtensa Dual-Core</text>

  <!-- Internal Firmware / Processing Blocks -->
  <rect x="240" y="145" width="140" height="34" rx="4" fill="#08182b" stroke="#00f2fe" stroke-width="1"/>
  <text x="310" y="161" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Digital Filtering</text>
  <text x="310" y="173" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">Embedded C/C++ Buffer</text>

  <rect x="240" y="188" width="140" height="34" rx="4" fill="#08182b" stroke="#f59e0b" stroke-width="1"/>
  <text x="310" y="204" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Threshold Engine</text>
  <text x="310" y="216" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">Anomaly Comparator</text>

  <rect x="240" y="232" width="140" height="34" rx="4" fill="#132c4c"/>
  <circle cx="255" cy="249" r="4" fill="#10b981"/>
  <text x="314" y="253" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" text-anchor="middle">Real-Time Loop</text>

  <!-- Bus to Display / Alert Output -->
  <path d="M 395 175 H 440" stroke="#00f2fe" stroke-width="2" stroke-dasharray="4 2"/>
  <polygon points="445,175 437,170 437,180" fill="#00f2fe"/>

  <!-- Right: Telemetry Display & Alert Module -->
  <rect x="445" y="80" width="120" height="190" rx="10" fill="#0c1d34" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="455" y="95" width="100" height="24" rx="4" fill="#082342"/>
  <text x="505" y="111" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">ALERT &amp; DISP</text>

  <!-- Mini Telemetry Screen -->
  <rect x="455" y="130" width="100" height="55" rx="4" fill="#051020" stroke="#00f2fe" stroke-width="1"/>
  <path d="M 460 160 L 472 160 L 476 145 L 482 172 L 487 152 L 493 162 L 505 160 L 515 160" fill="none" stroke="#00f2fe" stroke-width="1.5"/>
  <text x="505" y="142" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">TELEMETRY</text>

  <!-- Alert State Box -->
  <rect x="455" y="198" width="100" height="52" rx="4" fill="#1f1a14" stroke="#f59e0b" stroke-width="1"/>
  <circle cx="470" cy="216" r="4" fill="#f59e0b"/>
  <text x="510" y="219" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">TRIGGER</text>
  <text x="505" y="238" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">Audible/LED Alert</text>

  <!-- Header & Status Overlay -->
  <rect x="40" y="32" width="220" height="30" rx="6" fill="#0f223a" stroke="#00f2fe" stroke-width="1"/>
  <text x="50" y="52" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">Physiological Monitoring Node</text>

  <rect x="430" y="32" width="135" height="30" rx="6" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" stroke-width="1"/>
  <circle cx="445" cy="47" r="4" fill="#f59e0b"/>
  <text x="457" y="51" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">IN PROGRESS</text>

  <!-- Footer Tag -->
  <text x="40" y="335" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">ESP32 Firmware · Sensor Telemetry · Configurable Threshold Triggering</text>
</svg>
