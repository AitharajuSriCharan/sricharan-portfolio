<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071326"/>
      <stop offset="100%" stop-color="#030814"/>
    </linearGradient>
    <radialGradient id="fpGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <rect width="600" height="360" rx="12" fill="url(#bgFp)"/>
  
  <!-- Ambient Glow Behind Fingerprint -->
  <circle cx="170" cy="180" r="130" fill="url(#fpGlow)"/>
  
  <!-- Stylized Biometric Fingerprint Ridges -->
  <g fill="none" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
    <ellipse cx="170" cy="180" rx="15" ry="25"/>
    <ellipse cx="170" cy="180" rx="30" ry="48"/>
    <ellipse cx="170" cy="180" rx="46" ry="72"/>
    <ellipse cx="170" cy="180" rx="64" ry="96"/>
    <ellipse cx="170" cy="180" rx="82" ry="118"/>
    <ellipse cx="170" cy="180" rx="100" ry="135"/>
  </g>
  
  <!-- Inspection Grid Box over Fingerprint -->
  <rect x="110" y="120" width="120" height="120" rx="4" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="110" cy="120" r="3" fill="#38bdf8"/>
  <circle cx="230" cy="120" r="3" fill="#38bdf8"/>
  <circle cx="110" cy="240" r="3" fill="#38bdf8"/>
  <circle cx="230" cy="240" r="3" fill="#38bdf8"/>
  
  <!-- Connecting Data Bus -->
  <path d="M 230 180 H 310" stroke="#00f2fe" stroke-width="2" stroke-dasharray="5 3"/>
  <polygon points="315,180 307,175 307,185" fill="#00f2fe"/>
  
  <!-- Right Panel: MATLAB Metric Analysis Cards -->
  <rect x="320" y="50" width="240" height="255" rx="12" fill="#0b1b33" stroke="rgba(0, 242, 254, 0.25)" stroke-width="1.5"/>
  
  <text x="340" y="85" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">MATLAB Analysis Matrix</text>
  <text x="340" y="103" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">Statistical Image Metrics</text>
  
  <!-- Metric 1: Contrast -->
  <text x="340" y="135" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Ridge Contrast</text>
  <rect x="340" y="143" width="200" height="8" rx="4" fill="#1e293b"/>
  <rect x="340" y="143" width="170" height="8" rx="4" fill="#00f2fe"/>
  <text x="515" y="135" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">85%</text>
  
  <!-- Metric 2: Sharpness -->
  <text x="340" y="180" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Gradient Sharpness</text>
  <rect x="340" y="188" width="200" height="8" rx="4" fill="#1e293b"/>
  <rect x="340" y="188" width="156" height="8" rx="4" fill="#38bdf8"/>
  <text x="515" y="180" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">78%</text>
  
  <!-- Metric 3: Local Clarity -->
  <text x="340" y="225" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Local Clarity Index</text>
  <rect x="340" y="233" width="200" height="8" rx="4" fill="#1e293b"/>
  <rect x="340" y="233" width="184" height="8" rx="4" fill="#10b981"/>
  <text x="515" y="225" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">92%</text>
  
  <!-- Quality Score Tag -->
  <rect x="340" y="260" width="200" height="30" rx="6" fill="#112d4e" stroke="#00f2fe" stroke-width="1"/>
  <text x="440" y="280" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle" font-weight="bold">Estimated Score: High Quality</text>
  
  <!-- Note Banner -->
  <text x="40" y="335" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">* Image quality estimation model — not clinically/biometrically certified.</text>
</svg>
