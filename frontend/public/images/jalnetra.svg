<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgWater" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#05101f"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#00c6ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0072ff" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  
  <rect width="600" height="360" rx="12" fill="url(#bgWater)"/>
  
  <!-- Circuit Grid Lines -->
  <g stroke="rgba(0, 242, 254, 0.08)" stroke-width="1">
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="360"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="500" y1="0" x2="500" y2="360"/>
  </g>
  
  <!-- Smart Water Reservoir Tank Illustration -->
  <rect x="70" y="80" width="160" height="200" rx="16" fill="#0f2744" stroke="#00f2fe" stroke-width="2" stroke-dasharray="4 2"/>
  
  <!-- Water Level -->
  <path d="M 72 170 Q 110 160 150 170 T 228 170 L 228 278 A 14 14 0 0 1 214 278 L 86 278 A 14 14 0 0 1 72 278 Z" fill="url(#waveGrad)"/>
  
  <!-- Ultrasonic Sensor on top -->
  <rect x="120" y="65" width="60" height="15" rx="4" fill="#1e3a5f" stroke="#00f2fe" stroke-width="1.5"/>
  <circle cx="135" cy="72" r="3" fill="#00f2fe"/>
  <circle cx="165" cy="72" r="3" fill="#00f2fe"/>
  
  <!-- Sensor Ultrasonic Waves -->
  <path d="M 135 88 Q 150 95 165 88" stroke="#00f2fe" stroke-width="1.5" fill="none" opacity="0.8"/>
  <path d="M 125 102 Q 150 112 175 102" stroke="#00f2fe" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M 115 116 Q 150 130 185 116" stroke="#00f2fe" stroke-width="1.5" fill="none" opacity="0.4"/>
  
  <!-- Connection Traces to Processing Unit -->
  <path d="M 180 72 H 280 V 160 H 330" fill="none" stroke="#00f2fe" stroke-width="2" stroke-linecap="round"/>
  <circle cx="280" cy="72" r="3" fill="#00f2fe"/>
  <circle cx="280" cy="160" r="3" fill="#00f2fe"/>
  
  <!-- Microcontroller / Processing Unit -->
  <rect x="330" y="110" width="180" height="150" rx="12" fill="#0c1d36" stroke="#38bdf8" stroke-width="2"/>
  <rect x="345" y="125" width="60" height="60" rx="6" fill="#071224" stroke="#00f2fe" stroke-width="1.5"/>
  <text x="375" y="158" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle" font-weight="bold">ATMEGA</text>
  <text x="375" y="172" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">ARDUINO</text>
  
  <!-- Telemetry Graph inside MCU -->
  <path d="M 425 165 L 440 145 L 455 160 L 470 135 L 485 150 L 500 130" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <circle cx="500" cy="130" r="4" fill="#00f2fe"/>
  
  <!-- Status Indicator -->
  <rect x="345" y="210" width="150" height="34" rx="6" fill="#132a4a" stroke="#00f2fe" stroke-width="1"/>
  <circle cx="362" cy="227" r="5" fill="#10b981"/>
  <text x="378" y="231" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">Telemetry: Online</text>
  
  <!-- SIH 2025 Badge Overlay -->
  <rect x="370" y="30" width="190" height="36" rx="18" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="390" cy="48" r="6" fill="#10b981"/>
  <text x="406" y="52" fill="#10b981" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">SIH 2025 SELECTED</text>
  
  <!-- Title Label -->
  <text x="70" y="52" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800">JalNetra Architecture</text>
  <text x="70" y="318" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">Sensor Node · Telemetry · Threshold Alert Engine</text>
</svg>
